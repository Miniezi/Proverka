plugins {
 id 'java-library'
 id 'net.neoforged.moddev' version '2.0.141'
 id 'io.freefair.lombok' version '8.6'
}
group='slimeknights.tconstruct.port'
version='1.21.1-3.12.1-port.dev'
base { archivesName='TConstruct-UNFINISHED-PORT' }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
repositories {
 mavenCentral()
 maven { url='https://maven.blamejared.com' }
}
neoForge {
 version='21.1.238'
 runs { server { server(); programArgument '--nogui' }; client { client() } }
 mods { tconstruct { sourceSet sourceSets.main } }
}
sourceSets.main.resources.srcDir('src/generated/resources')
dependencies {
 implementation fileTree(dir:'../../../mantle-build/build/libs',include:['Mantle-*.jar'],exclude:['*-sources.jar','*-javadoc.jar'])
 compileOnly 'mezz.jei:jei-1.21.1-common-api:19.51.0.418'
 compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.51.0.418'
 compileOnly fileTree(dir:'../../compat-libs',include:['*.jar'])
}
tasks.withType(JavaCompile).configureEach {
 options.encoding='UTF-8'
 options.compilerArgs += ['-Xmaxerrs','10000','-Xmaxwarns','10']
}
