name: MINI additions 1.21.1 port
on:
  push:
    branches: [mini-additions-1.21.1]
    paths: ['ports/mini-additions/**', '.github/workflows/mini-additions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: pip install nbtlib==2.0.4
      - run: python port.py
        working-directory: ports/mini-additions
      - run: python download_deps.py
        working-directory: ports/mini-additions/harness
      - run: gradle build --no-daemon --console=plain
        working-directory: ports/mini-additions/harness
      - run: python smoke_server.py
        working-directory: ports/mini-additions/harness
      - run: |
          mv server-smoke.log server-smoke-base.log
          python smoke_server.py
        env:
          MINI_COMPAT: 'true'
        working-directory: ports/mini-additions/harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-additions-1.21.1-results
          path: |
            ports/mini-additions/dist/*.jar
            ports/mini-additions/harness/server-smoke*.log
            ports/mini-additions/harness/run/logs/latest.log
