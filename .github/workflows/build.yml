name: Build addon
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: crafting-mastery-addon
          path: build/libs/*.jar
